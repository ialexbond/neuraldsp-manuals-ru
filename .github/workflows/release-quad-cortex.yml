name: Выпуск объединённого руководства Quad Cortex

on:
  pull_request:
    branches: [main]
    types: [closed]
    paths:
      - "manuals/quad-cortex/*.pdf"
      - "README.md"

permissions:
  contents: write
  issues: write

concurrency:
  group: quad-cortex-manual-release
  cancel-in-progress: false

env:
  CONFIG: .github/manuals/quad-cortex.json
  PYTHONUTF8: "1"
  GH_TOKEN: ${{ github.token }}

jobs:
  release:
    name: Публикация руководства
    if: >-
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'update/quad-cortex/')
    runs-on: ubuntu-latest
    steps:
      - name: Получить объединённую версию репозитория
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Настроить Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/requirements.txt

      - name: Установить зависимости для проверки
        run: python -m pip install -r .github/requirements.txt

      - name: Повторно проверить объединённые публичные файлы
        run: |
          python .github/scripts/manual_sync.py validate-repository \
            --config "$CONFIG" \
            --repository "$GITHUB_WORKSPACE" \
            --result "$RUNNER_TEMP/merged-validation.json"

      - name: Определить дату редакции
        id: metadata
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          import re

          branch = os.environ["HEAD_BRANCH"]
          date = re.search(r"update/quad-cortex/(\d{4}-\d{2}-\d{2})$", branch)
          if not date:
              raise SystemExit("В имени ветки отсутствует дата редакции")
          print(f"edition_date={date.group(1)}")
          PY

      - name: Создать публичный релиз PDF
        env:
          EDITION_DATE: ${{ steps.metadata.outputs.edition_date }}
        run: |
          pdf="$(find manuals/quad-cortex -maxdepth 1 -type f -name '*.pdf' -print -quit)"
          version="$(basename "$pdf" | sed -E 's/^Quad_Cortex_User_Manual_RU_v([0-9]+\.[0-9]+\.[0-9]+)_rev[0-9]{4}-[0-9]{2}-[0-9]{2}\.pdf$/\1/')"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Не удалось определить официальную версию по имени файла $pdf" >&2
            exit 1
          fi
          tag="quad-cortex-v${version}-ru.${EDITION_DATE}"
          notes="$RUNNER_TEMP/release-notes.md"
          {
            echo "Полное руководство пользователя Neural DSP Quad Cortex $version на русском языке в формате PDF."
            echo
            echo "Дата редакции: $EDITION_DATE"
            echo "Официальный источник: https://neuraldsp.com/manual/quad-cortex"
            echo "Запрос на слияние: #${{ github.event.pull_request.number }}"
          } > "$notes"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$pdf" --clobber
            gh release edit "$tag" --notes-file "$notes" --title "Quad Cortex $version — инструкция на русском языке (PDF)"
          else
            gh release create "$tag" "$pdf" \
              --target "${{ github.event.pull_request.merge_commit_sha }}" \
              --title "Quad Cortex $version — инструкция на русском языке (PDF)" \
              --notes-file "$notes"
          fi

      - name: Закрыть уведомления об устаревшем содержимом
        run: |
          for issue in $(gh issue list --state open --label update-detected --search 'руководство Quad Cortex in:title' --json number --jq '.[].number'); do
            gh issue close "$issue" --comment "Обновлённый PDF объединён в запросе #${{ github.event.pull_request.number }} и успешно опубликован."
          done
