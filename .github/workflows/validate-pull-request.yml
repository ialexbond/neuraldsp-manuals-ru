name: Validate pull request

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-quad-cortex-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  CONFIG: .github/manuals/quad-cortex.json
  PYTHONUTF8: "1"

jobs:
  validate:
    name: Repository validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out the pull request
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/requirements.txt

      - name: Install validation dependencies
        run: python -m pip install -r .github/requirements.txt

      - name: Run unit and workflow-contract tests
        run: python -m unittest discover -s .github/tests -v

      - name: Enforce the public repository policy
        run: |
          python .github/scripts/manual_sync.py validate-repository \
            --config "$CONFIG" \
            --repository "$GITHUB_WORKSPACE" \
            --result "$RUNNER_TEMP/repository-validation.json"
