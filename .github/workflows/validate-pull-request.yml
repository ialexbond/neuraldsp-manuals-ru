name: Проверка запроса на слияние

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-quad-cortex-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  CONFIG: .github/manuals/quad-cortex.json
  PYTHONUTF8: "1"

jobs:
  validate:
    name: Проверка репозитория
    runs-on: ubuntu-latest
    steps:
      - name: Получить изменения из запроса на слияние
        uses: actions/checkout@v7

      - name: Настроить Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/requirements.txt

      - name: Установить зависимости для проверки
        run: python -m pip install -r .github/requirements.txt

      - name: Запустить модульные тесты и проверку сценариев
        run: python -m unittest discover -s .github/tests -v

      - name: Проверить правила публичного репозитория
        run: |
          python .github/scripts/manual_sync.py validate-repository \
            --config "$CONFIG" \
            --repository "$GITHUB_WORKSPACE" \
            --result "$RUNNER_TEMP/repository-validation.json"
