name: Проверка запроса на слияние

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-manuals-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"

jobs:
  validate:
    name: Проверка репозитория
    runs-on: ubuntu-latest
    steps:
      - name: Получить изменения из запроса на слияние
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Настроить Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/requirements.txt

      - name: Установить зависимости для проверки
        run: python -m pip install -r .github/requirements.txt

      - name: Проверить разделение публикуемых руководств
        run: |
          python .github/scripts/validate_publication.py \
            --repository "$GITHUB_WORKSPACE" \
            --base "${{ github.event.pull_request.base.sha }}" \
            --head "${{ github.event.pull_request.head.sha }}"

      - name: Запустить модульные тесты и проверку сценариев
        run: python -m unittest discover -s .github/tests -v

      - name: Проверить правила публичного репозитория
        run: |
          for config in .github/manuals/*.json; do
            slug="$(basename "$config" .json)"
            python .github/scripts/manual_sync.py validate-repository \
              --config "$config" \
              --repository "$GITHUB_WORKSPACE" \
              --result "$RUNNER_TEMP/$slug-validation.json"
          done
