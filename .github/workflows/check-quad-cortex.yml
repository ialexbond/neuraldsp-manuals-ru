name: Проверка руководства Quad Cortex

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quad-cortex-manual-state
  cancel-in-progress: false

env:
  CONFIG: .github/manuals/quad-cortex.json
  STATE_TAG: automation-state-quad-cortex-v1
  STATE_ASSET: quad-cortex-state-v1.zip
  PYTHONUTF8: "1"
  GH_TOKEN: ${{ github.token }}

jobs:
  check:
    name: Резервное сравнение без изменений
    runs-on: ubuntu-latest
    steps:
      - name: Получить опубликованный репозиторий
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Настроить Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/requirements.txt

      - name: Установить зависимости для сравнения
        run: python -m pip install -r .github/requirements.txt

      - name: Скачать сохранённое состояние автоматизации
        id: state
        continue-on-error: true
        run: |
          mkdir -p "$RUNNER_TEMP/quad-cortex/input"
          gh release download "$STATE_TAG" \
            --pattern "$STATE_ASSET" \
            --dir "$RUNNER_TEMP/quad-cortex/input"

      - name: Сообщить об отсутствии исходного состояния
        if: steps.state.outcome == 'failure'
        run: |
          echo "Не удалось запустить резервную проверку без изменений: отсутствует файл сохранённого состояния."
          echo "Ожидаемый служебный релиз: $STATE_TAG"
          echo "Ожидаемый файл: $STATE_ASSET"
          echo "Восстановите служебный архив состояния и повторите проверку."
          exit 1

      - name: Сравнить разделы официального руководства
        id: compare
        if: steps.state.outcome == 'success'
        continue-on-error: true
        run: |
          python .github/scripts/manual_sync.py check \
            --config "$CONFIG" \
            --state-archive "$RUNNER_TEMP/quad-cortex/input/$STATE_ASSET" \
            --work-directory "$RUNNER_TEMP/quad-cortex/check" \
            --snapshot-output "$RUNNER_TEMP/quad-cortex/candidate.json" \
            --report "$RUNNER_TEMP/quad-cortex/report.json"
          echo "status=$(python -c 'import json; print(json.load(open("'"$RUNNER_TEMP/quad-cortex/report.json"'", encoding="utf-8"))["status"])')" >> "$GITHUB_OUTPUT"

      - name: Сообщить об ошибке сравнения с оригиналом
        if: steps.compare.outcome == 'failure'
        run: |
          echo "Не удалось сравнить официальную страницу Quad Cortex с сохранённой версией."
          echo "Опубликованный PDF и сохранённое состояние не изменены."
          echo "Обычно это означает, что изменилась структура сайта или источник временно недоступен."
          exit 1

      - name: Сформировать сводку проверки
        if: steps.compare.outcome == 'success'
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          report = json.loads(Path(os.environ["RUNNER_TEMP"] + "/quad-cortex/report.json").read_text(encoding="utf-8"))
          status_names = {
              "unchanged": "изменений нет",
              "safe_change": "обнаружено безопасное изменение",
              "blocked": "требуется ручная проверка",
          }
          status = status_names.get(report["status"], report["status"])
          lines = [
              "## Проверка руководства Quad Cortex",
              "",
              f"- Результат: **{status}**",
              f"- Официальная версия: **{report['upstream_version']}**",
              f"- Изменённые смысловые блоки: **{len(report['changed_units'])}**",
              f"- Добавленные блоки: **{len(report['added_units'])}**",
              f"- Удалённые блоки: **{len(report['removed_units'])}**",
              "",
              "Этот сценарий запускается вручную и не изменяет опубликованные файлы.",
          ]
          if report["reasons"]:
              lines += ["", "### Примечания к проверке", ""] + [f"- {item}" for item in report["reasons"]]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as handle:
              handle.write("\n".join(lines) + "\n")
          PY

      - name: Подтвердить завершение без изменений
        if: steps.compare.outcome == 'success'
        run: |
          case "${{ steps.compare.outputs.status }}" in
            unchanged) result="изменений нет" ;;
            safe_change) result="обнаружено безопасное изменение" ;;
            blocked) result="требуется ручная проверка" ;;
            *) result="${{ steps.compare.outputs.status }}" ;;
          esac
          echo "Результат сравнения: $result"
          echo "Ветки, коммиты, запросы на слияние, релизы, PDF и сохранённое состояние не изменялись."
